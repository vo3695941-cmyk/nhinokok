<!DOCTYPE html>
<html translate="no" class="notranslate">
<head>
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML5 Doom Mobile - Next Button</title>
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <!-- MÀN HÌNH GAME -->
    <canvas id="gameCanvas" width="320" height="200"></canvas>

    <!-- KHU VỰC ĐIỀU KHIỂN DƯỚI -->
    <div class="controller-area">
        <div class="move-controls">
            <div class="empty"></div>
            <div class="btn" id="btnUp">▲</div>
            <div class="empty"></div>
            <div class="btn" id="btnLeft">◀</div>
            <div class="btn" id="btnDown">▼</div>
            <div class="btn" id="btnRight">▶</div>
        </div>

        <div class="action-controls">
            <div class="rotate-group">
                <div class="btn" id="btnLookLeft" style="font-size: 13px;">Q.Trái</div>
                <div class="btn" id="btnLookRight" style="font-size: 13px;">Q.Phải</div>
            </div>
            <!-- Cụm nút hành động bên phải: Có thêm nút NEXT riêng biệt -->
            <div class="fire-group">
                <div class="btn btn-next" id="btnNext">NEXT</div>
                <div class="btn btn-fire" id="btnFire">FIRE</div>
            </div>
        </div>
    </div>

    <script src="maps.js?v=10"></script>
    <script src="script.js?v=10"></script>
</body>
</html>
