<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini HTML5 Doom Mobile - Modular</title>
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100vh; overflow: hidden; touch-action: manipulation; }
        #game-container { position: relative; width: 100%; max-width: 640px; aspect-ratio: 16/10; border-bottom: 4px solid #333; }
        canvas { width: 100%; height: 100%; background: #000; display: block; }
        #ui { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); font-family: monospace; font-size: 14px; color: #ff3333; text-shadow: 1px 1px #000; font-weight: bold; pointer-events: none; display: flex; gap: 12px; background: rgba(0,0,0,0.75); padding: 4px 10px; border-radius: 5px; white-space: nowrap; }
        #msg-box { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); font-family: monospace; font-size: 16px; color: #ffff00; text-shadow: 1px 1px #000; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 4px; text-align: center; pointer-events: none; max-width: 90%; }
        #controls { flex: 1; width: 100%; max-width: 500px; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; padding: 15px; box-sizing: border-box; }
        .btn { background: #222; border: 2px solid #444; color: white; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 10px; user-select: none; -webkit-user-select: none; }
        .btn:active { background: #444; }
        #btn-shoot { background: #990000; border-color: #ff3333; grid-column: 2; grid-row: 2; }
        #btn-shoot:active { background: #ff0000; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="640" height="400"></canvas>
        <div id="msg-box">MÀN 1: Diệt đủ 5 quái thường để mở lối rẽ bên Phải!</div>
        <div id="ui">
            <div>MÀN: <span id="level">1</span></div>
            <div>ĐẠN: <span id="ammo">999</span></div>
            <div>DIỆT: <span id="score">0/5</span></div>
        </div>
    </div>

    <div id="controls">
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-up">▲</div>
        <div class="btn" id="btn-right">▶</div>
        <div></div>
        <div class="btn" id="btn-shoot">BẮN</div>
        <div class="btn" id="btn-down">▼</div>
    </div>

    <!-- Nạp hệ thống module game sạch lỗi -->
    <script src="map.js"></script>
    <script src="player.js"></script>
    <script src="render.js"></script>
</body>
</html>
